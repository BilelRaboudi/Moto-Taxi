server.port=8080
spring.application.name=mototaxi-api

# DataSource (XAMPP MySQL par defaut: root sans mot de passe)
spring.datasource.url=jdbc:mysql://localhost:3306/mototaxi_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=MotoTaxiSecretKey2026VeryLongSecretKeyForJWTGeneration
jwt.expiration=86400000

# CORS
cors.allowed-origins=http://localhost:4200,http://localhost:3000
