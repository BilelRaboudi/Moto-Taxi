<div class="min-h-screen bg-[#F4F5F7] flex flex-col md:flex-row">

  <!-- Responsive Sidebar / Mobile Header -->
  <aside class="w-full md:w-64 bg-[#1A1A1A] text-white flex flex-col shrink-0">
    
    <!-- Logo area -->
    <div class="p-5 pb-4 flex items-center justify-between border-b border-white/10">
      <div class="flex items-center gap-2.5 font-black tracking-tight text-white">
        <div class="w-8 h-8 rounded-full bg-[#F5C518] flex items-center justify-center text-[#1A1A1A]">
          <i class="fa-solid fa-shield-halved text-sm"></i>
        </div>
        <div class="text-base font-black tracking-tight">
          <span>MOTO</span><span class="text-[#F5C518]">TAXI</span>
          <span class="text-[10px] bg-white/10 text-gray-300 font-bold px-2 py-0.5 rounded ml-2">ADMIN</span>
        </div>
      </div>

      <!-- Mobile Logout -->
      <button (click)="logout()" class="md:hidden text-xs text-red-400 p-2">
        <i class="fa-solid fa-arrow-right-from-bracket"></i>
      </button>
    </div>

    <!-- Navigation links -->
    <nav class="flex md:flex-col overflow-x-auto md:overflow-visible p-4 gap-1 text-xs font-bold shrink-0">
      <a 
        routerLink="/admin/dashboard" 
        routerLinkActive="bg-[#F5C518] text-[#1A1A1A] shadow-sm font-black" 
        [routerLinkActiveOptions]="{exact: true}"
        class="whitespace-nowrap flex items-center gap-2.5 px-4 py-2.5 rounded-xl text-gray-400 hover:text-white hover:bg-white/5 transition">
        <i class="fa-solid fa-gauge-high text-sm w-4"></i>
        <span>Tableau de bord</span>
      </a>

      <a 
        routerLink="/admin/drivers" 
        routerLinkActive="bg-[#F5C518] text-[#1A1A1A] shadow-sm font-black" 
        class="whitespace-nowrap flex items-center justify-between gap-3 px-4 py-2.5 rounded-xl text-gray-400 hover:text-white hover:bg-white/5 transition">
        <div class="flex items-center gap-2.5">
          <i class="fa-solid fa-id-card text-sm w-4"></i>
          <span>Chauffeurs</span>
        </div>
        <span class="w-4 h-4 rounded-full bg-red-500 text-white text-[9px] flex items-center justify-center font-black">3</span>
      </a>

      <a 
        routerLink="/admin/rides" 
        routerLinkActive="bg-[#F5C518] text-[#1A1A1A] shadow-sm font-black" 
        class="whitespace-nowrap flex items-center gap-2.5 px-4 py-2.5 rounded-xl text-gray-400 hover:text-white hover:bg-white/5 transition">
        <i class="fa-solid fa-route text-sm w-4"></i>
        <span>Courses</span>
      </a>

      <a 
        routerLink="/admin/tariffs" 
        routerLinkActive="bg-[#F5C518] text-[#1A1A1A] shadow-sm font-black" 
        class="whitespace-nowrap flex items-center gap-2.5 px-4 py-2.5 rounded-xl text-gray-400 hover:text-white hover:bg-white/5 transition">
        <i class="fa-solid fa-coins text-sm w-4"></i>
        <span>Tarifs</span>
      </a>

      <a 
        routerLink="/admin/accounts" 
        routerLinkActive="bg-[#F5C518] text-[#1A1A1A] shadow-sm font-black" 
        class="whitespace-nowrap flex items-center gap-2.5 px-4 py-2.5 rounded-xl text-gray-400 hover:text-white hover:bg-white/5 transition">
        <i class="fa-solid fa-users text-sm w-4"></i>
        <span>Comptes</span>
      </a>
    </nav>

    <!-- Logout on Desktop -->
    <div class="hidden md:block p-4 mt-auto border-t border-white/10">
      <button 
        (click)="logout()"
        class="w-full flex items-center gap-3 px-4 py-2.5 rounded-xl text-gray-400 hover:text-red-400 hover:bg-red-500/10 transition text-xs font-bold">
        <i class="fa-solid fa-arrow-right-from-bracket text-sm w-4"></i>
        <span>Déconnexion</span>
      </button>
    </div>

  </aside>

  <!-- Main Admin Content Area -->
  <div class="flex-1 flex flex-col overflow-hidden min-w-0">
    
    <!-- Top Header -->
    <header class="bg-white border-b border-gray-200 px-4 sm:px-8 py-3.5 flex items-center justify-between sticky top-0 z-20">
      <div class="flex items-center gap-3">
        <h1 class="text-base sm:text-lg font-black text-gray-900 tracking-tight">Supervision Centrale</h1>
        <span class="bg-green-100 text-green-800 text-[10px] font-black uppercase px-2.5 py-0.5 rounded-full">Serveurs Actifs</span>
      </div>

      <div class="flex items-center gap-3">
        <span class="text-xs font-bold text-gray-700 hidden sm:inline">
          {{ authService.currentUser()?.fullName || 'Super Admin' }}
        </span>
        <div class="w-9 h-9 rounded-full bg-[#1A1A1A] text-[#F5C518] flex items-center justify-center font-black text-xs shadow-sm">
          AD
        </div>
      </div>
    </header>

    <!-- Subpage Content -->
    <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8">
      <router-outlet></router-outlet>
    </main>

  </div>

</div>
