<div class="min-h-screen bg-[#F4F5F7] flex flex-col md:flex-row">

  <!-- Left Dark Sidebar (Exact match of interface.png right screen) -->
  <aside class="w-full md:w-64 bg-[#1A1A1A] text-white flex flex-col shrink-0">
    
    <!-- Logo area -->
    <div class="p-6 pb-4">
      <div class="flex items-center gap-2 font-black tracking-tight text-white">
        <div class="w-8 h-8 rounded-full bg-[#F5C518] flex items-center justify-center text-[#1A1A1A]">
          <i class="fa-solid fa-motorcycle text-sm"></i>
        </div>
        <div class="text-lg font-black tracking-tight">
          <span>MOTO</span><span class="text-[#F5C518]">TAXI</span>
        </div>
      </div>
    </div>

    <!-- Quick Role Switcher in Admin Sidebar -->
    <div class="px-6 py-2">
      <div class="bg-[#2A2A2A] p-1 rounded-full flex gap-1 border border-white/10">
        <button (click)="switchRole('client')" class="flex-1 text-gray-400 font-medium py-1 rounded-full text-[11px] hover:text-white transition">
          Client
        </button>
        <button (click)="switchRole('driver')" class="flex-1 text-gray-400 font-medium py-1 rounded-full text-[11px] hover:text-white transition">
          Chauffeur
        </button>
        <button class="flex-1 bg-[#F5C518] text-[#1A1A1A] font-extrabold py-1 rounded-full text-[11px]">
          Admin
        </button>
      </div>
    </div>

    <!-- Sidebar Search -->
    <div class="px-6 py-3">
      <div class="relative">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
        <input 
          type="text" 
          placeholder="Recherche..." 
          class="w-full bg-[#2A2A2A] text-xs text-white pl-8 pr-3 py-2 rounded-xl focus:outline-none focus:ring-1 focus:ring-[#F5C518] placeholder-gray-500 border border-transparent">
      </div>
    </div>

    <!-- Navigation links (from interface.png) -->
    <nav class="flex-1 px-4 py-2 space-y-1 text-xs font-bold">
      <a 
        routerLink="/admin/dashboard" 
        routerLinkActive="bg-[#F5C518] text-[#1A1A1A] shadow-sm" 
        [routerLinkActiveOptions]="{exact: true}"
        class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-400 hover:text-white hover:bg-white/5 transition">
        <i class="fa-solid fa-gauge-high text-sm w-4"></i>
        <span>Tableau de bord</span>
      </a>

      <a 
        routerLink="/admin/drivers" 
        routerLinkActive="bg-[#F5C518] text-[#1A1A1A] shadow-sm" 
        class="flex items-center justify-between px-4 py-3 rounded-xl text-gray-400 hover:text-white hover:bg-white/5 transition">
        <div class="flex items-center gap-3">
          <i class="fa-solid fa-id-card text-sm w-4"></i>
          <span>Chauffeurs</span>
        </div>
        <span class="w-5 h-5 rounded-full bg-red-500 text-white text-[10px] flex items-center justify-center font-black">3</span>
      </a>

      <a 
        routerLink="/admin/rides" 
        routerLinkActive="bg-[#F5C518] text-[#1A1A1A] shadow-sm" 
        class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-400 hover:text-white hover:bg-white/5 transition">
        <i class="fa-solid fa-route text-sm w-4"></i>
        <span>Courses</span>
      </a>

      <a 
        routerLink="/admin/tariffs" 
        routerLinkActive="bg-[#F5C518] text-[#1A1A1A] shadow-sm" 
        class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-400 hover:text-white hover:bg-white/5 transition">
        <i class="fa-solid fa-coins text-sm w-4"></i>
        <span>Tarifs</span>
      </a>

      <a 
        routerLink="/admin/accounts" 
        routerLinkActive="bg-[#F5C518] text-[#1A1A1A] shadow-sm" 
        class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-400 hover:text-white hover:bg-white/5 transition">
        <i class="fa-solid fa-users text-sm w-4"></i>
        <span>Comptes</span>
      </a>
    </nav>

    <!-- Logout at bottom -->
    <div class="p-4 border-t border-white/10">
      <button 
        (click)="authService.logout()"
        class="w-full flex items-center gap-3 px-4 py-2.5 rounded-xl text-gray-400 hover:text-red-400 hover:bg-red-500/10 transition text-xs font-bold">
        <i class="fa-solid fa-arrow-right-from-bracket text-sm w-4"></i>
        <span>Déconnexion</span>
      </button>
    </div>

  </aside>

  <!-- Main Admin Area -->
  <div class="flex-1 flex flex-col overflow-hidden">
    
    <!-- Top Header -->
    <header class="bg-white border-b border-gray-200 px-8 py-4 flex items-center justify-between">
      <div class="flex items-center gap-4">
        <h1 class="text-lg font-black text-gray-900 tracking-tight">Tableau de bord</h1>
      </div>

      <div class="flex items-center gap-3">
        <button class="bg-[#F5C518] hover:bg-[#E5B50A] text-[#1A1A1A] font-extrabold text-xs px-4 py-2 rounded-xl shadow-sm flex items-center gap-2 transition">
          <i class="fa-solid fa-arrow-up-from-bracket"></i>
          <span>Exporter</span>
        </button>

        <div class="w-9 h-9 rounded-full bg-gray-100 flex items-center justify-center font-bold text-xs text-gray-700">
          AD
        </div>
      </div>
    </header>

    <!-- Subpage Content -->
    <main class="flex-1 overflow-y-auto p-8">
      <router-outlet></router-outlet>
    </main>

  </div>

</div>
