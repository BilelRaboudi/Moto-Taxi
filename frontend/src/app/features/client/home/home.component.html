<div class="flex-1 flex flex-col md:grid md:grid-cols-12 md:gap-6 relative w-full h-full">

  <!-- Left Column (Desktop) / Floating Form & Cards (Mobile) -->
  <div class="md:col-span-5 lg:col-span-4 flex flex-col justify-between order-2 md:order-1 bg-white md:rounded-3xl shadow-sm border border-gray-100 p-5 md:p-6 z-20">
    
    <div class="space-y-4">
      
      <!-- Search Input Card -->
      <div>
        <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1.5">Destination</label>
        <div class="bg-gray-50 rounded-2xl p-2.5 flex items-center border border-gray-200 focus-within:border-[#F5C518] focus-within:ring-2 focus-within:ring-[#F5C518]/20 transition">
          <div class="w-9 flex items-center justify-center text-gray-400">
            <i class="fa-solid fa-magnifying-glass text-base"></i>
          </div>
          <div class="flex-1 pr-2">
            <input 
              type="text" 
              [(ngModel)]="destinationQuery"
              (ngModelChange)="fetchEstimate()"
              placeholder="Où voulez-vous aller ?"
              class="w-full text-sm font-bold text-gray-800 placeholder-gray-400 focus:outline-none bg-transparent">
            <span class="text-[11px] text-gray-400 block -mt-0.5" dir="rtl">وين تحب تمشي؟</span>
          </div>
          <button 
            (click)="confirmBooking()"
            class="w-10 h-10 rounded-full bg-[#F5C518] flex items-center justify-center text-gray-900 shadow-md hover:bg-[#E5B50A] transition shrink-0">
            <i class="fa-solid fa-location-arrow text-sm"></i>
          </button>
        </div>
      </div>

      <!-- Departure Info -->
      <div class="p-3 bg-yellow-50/60 rounded-2xl border border-yellow-200/60 flex items-center gap-3 text-xs">
        <div class="w-8 h-8 rounded-full bg-[#F5C518] flex items-center justify-center text-gray-900 font-bold shrink-0">
          <i class="fa-solid fa-crosshairs text-xs"></i>
        </div>
        <div class="truncate">
          <span class="text-[10px] uppercase font-bold text-gray-500 block">Position de départ</span>
          <p class="font-bold text-gray-900 truncate">{{ origin.address }}</p>
        </div>
      </div>

      <!-- Derniers Trajets Section -->
      <div>
        <div class="flex items-center justify-between mb-2">
          <div class="flex items-center gap-2">
            <i class="fa-regular fa-clock text-gray-500 text-xs"></i>
            <h3 class="text-xs font-extrabold uppercase tracking-wider text-gray-700">Derniers trajets</h3>
          </div>
          <span class="text-[11px] font-semibold text-gray-400">À partir de 5 TND</span>
        </div>

        <div class="space-y-2">
          <div 
            *ngFor="let trip of recentTrips" 
            (click)="selectRecent(trip)"
            class="flex items-center justify-between p-3 rounded-2xl hover:bg-gray-50 cursor-pointer transition border border-gray-100 hover:border-gray-200 group">
            <div class="flex items-center gap-3">
              <div class="w-8 h-8 rounded-full bg-gray-100 group-hover:bg-[#F5C518]/20 flex items-center justify-center text-gray-600 transition">
                <i class="fa-solid fa-location-dot text-xs"></i>
              </div>
              <div>
                <p class="text-xs font-bold text-gray-900">{{ trip.name }}</p>
                <p class="text-[10px] text-gray-400">{{ trip.subtext }}</p>
              </div>
            </div>
            <span class="text-xs font-bold text-[#D4A000] bg-yellow-50 px-2.5 py-1 rounded-full border border-yellow-200">
              {{ trip.price }}
            </span>
          </div>
        </div>
      </div>

    </div>

    <!-- Vehicle Selector and Confirm Button Bar -->
    <div class="pt-4 border-t border-gray-100 mt-4 space-y-3">
      <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider">Type de véhicule</label>
      <div class="grid grid-cols-3 gap-2.5">
        
        <!-- Moto Card -->
        <button 
          (click)="selectVehicle('MOTO')"
          [class.border-[#F5C518]]="selectedVehicle === 'MOTO'"
          [class.bg-yellow-50]="selectedVehicle === 'MOTO'"
          class="p-3 border-2 border-gray-100 rounded-2xl flex flex-col items-center justify-center gap-1 transition hover:border-gray-300">
          <i class="fa-solid fa-motorcycle text-xl text-gray-800"></i>
          <span class="text-xs font-bold text-gray-800">Moto</span>
          <span class="text-[10px] text-gray-400 font-semibold">1 passager</span>
        </button>

        <!-- Taxi Card -->
        <button 
          (click)="selectVehicle('TAXI')"
          [class.border-[#F5C518]]="selectedVehicle === 'TAXI'"
          [class.bg-yellow-50]="selectedVehicle === 'TAXI'"
          class="p-3 border-2 border-gray-100 rounded-2xl flex flex-col items-center justify-center gap-1 transition hover:border-gray-300">
          <i class="fa-solid fa-taxi text-xl text-gray-800"></i>
          <span class="text-xs font-bold text-gray-800">Taxi</span>
          <span class="text-[10px] text-gray-400 font-semibold">Grand confort</span>
        </button>

        <!-- Express Card -->
        <button 
          (click)="selectVehicle('EXPRESS')"
          [class.border-[#F5C518]]="selectedVehicle === 'EXPRESS'"
          [class.bg-yellow-50]="selectedVehicle === 'EXPRESS'"
          class="p-3 border-2 border-gray-100 rounded-2xl flex flex-col items-center justify-center gap-1 transition hover:border-gray-300">
          <i class="fa-solid fa-truck-fast text-xl text-gray-800"></i>
          <span class="text-xs font-bold text-gray-800">Express</span>
          <span class="text-[10px] text-gray-400 font-semibold">Colis rapide</span>
        </button>

      </div>

      <!-- Action Button -->
      <button 
        (click)="confirmBooking()"
        [disabled]="isEstimating"
        class="w-full bg-[#F5C518] hover:bg-[#E5B50A] text-[#1A1A1A] font-black py-4 px-6 rounded-2xl shadow-lg hover:shadow-xl transition-all duration-200 flex items-center justify-between mt-3 disabled:opacity-50 active:scale-95">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-motorcycle text-base"></i>
          <span class="text-sm uppercase tracking-wider font-extrabold">Confirmer la course</span>
        </div>
        <div class="text-right">
          <span class="text-base font-black">{{ estimatedPrice | number:'1.1-1' }} TND</span>
        </div>
      </button>

    </div>

  </div>

  <!-- Right Column (Desktop) / Top Map (Mobile) -->
  <div class="md:col-span-7 lg:col-span-8 order-1 md:order-2 h-[300px] sm:h-[380px] md:h-[680px] bg-gray-100 md:rounded-3xl overflow-hidden shadow-sm border border-gray-200 relative">
    <div id="clientMap" class="w-full h-full"></div>
    
    <!-- Floating Recenter Control -->
    <div class="absolute bottom-4 right-4 z-[400]">
      <button class="w-11 h-11 rounded-2xl bg-white shadow-lg flex items-center justify-center text-gray-800 hover:bg-gray-50 border border-gray-200 transition">
        <i class="fa-solid fa-crosshairs text-base"></i>
      </button>
    </div>

    <!-- Live Traffic & Region Badge on Desktop -->
    <div class="hidden sm:flex absolute top-4 left-4 z-[400] bg-white/95 backdrop-blur-md px-4 py-2 rounded-2xl shadow-md border border-gray-100 items-center gap-2 text-xs font-bold text-gray-700">
      <div class="w-2.5 h-2.5 rounded-full bg-green-500 animate-pulse"></div>
      <span>Grand Tunis • 142 Mototaxis en circulation</span>
    </div>
  </div>

</div>
