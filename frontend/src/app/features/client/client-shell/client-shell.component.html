<div class="min-h-screen bg-[#F4F5F7] flex flex-col">

  <!-- Responsive Top Header -->
  <header class="bg-white border-b border-gray-200 sticky top-0 z-30 px-4 sm:px-8 py-3.5 shadow-sm">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      
      <!-- Brand -->
      <div class="flex items-center gap-3">
        <app-logo></app-logo>
      </div>

      <!-- Center: Active Space Badge & Quick Links -->
      <div class="hidden sm:flex items-center gap-2">
        <span class="bg-yellow-50 text-yellow-800 border border-yellow-200 text-xs font-bold px-3 py-1 rounded-full flex items-center gap-1.5">
          <i class="fa-solid fa-user text-xs"></i>
          <span>Espace Client</span>
        </span>
      </div>

      <!-- Right: Desktop Navigation & User Profile -->
      <div class="flex items-center gap-4 sm:gap-6">
        <nav class="hidden md:flex items-center gap-1 text-xs font-bold text-gray-600">
          <a routerLink="/client/home" routerLinkActive="bg-[#F5C518]/20 text-[#1A1A1A]" [routerLinkActiveOptions]="{exact: true}" class="px-3.5 py-2 rounded-xl hover:bg-gray-100 transition flex items-center gap-2">
            <i class="fa-solid fa-compass text-sm text-[#F5C518]"></i>
            <span>Commander</span>
          </a>
          <a routerLink="/client/tracking" routerLinkActive="bg-[#F5C518]/20 text-[#1A1A1A]" class="px-3.5 py-2 rounded-xl hover:bg-gray-100 transition flex items-center gap-2">
            <i class="fa-solid fa-location-dot text-sm text-[#F5C518]"></i>
            <span>Suivi direct</span>
          </a>
          <a routerLink="/client/history" routerLinkActive="bg-[#F5C518]/20 text-[#1A1A1A]" class="px-3.5 py-2 rounded-xl hover:bg-gray-100 transition flex items-center gap-2">
            <i class="fa-regular fa-clock text-sm text-[#F5C518]"></i>
            <span>Historique</span>
          </a>
          <a routerLink="/client/profile" routerLinkActive="bg-[#F5C518]/20 text-[#1A1A1A]" class="px-3.5 py-2 rounded-xl hover:bg-gray-100 transition flex items-center gap-2">
            <i class="fa-regular fa-user text-sm text-[#F5C518]"></i>
            <span>Profil</span>
          </a>
        </nav>

        <div class="flex items-center gap-3">
          <div class="text-right hidden sm:block">
            <p class="text-xs font-bold text-gray-900 leading-tight">{{ authService.currentUser()?.fullName || 'Client MotoTaxi' }}</p>
            <p class="text-[10px] text-gray-400 font-medium">{{ authService.currentUser()?.phone || 'Grand Tunis' }}</p>
          </div>

          <button 
            (click)="logout()" 
            title="Se déconnecter"
            class="text-xs font-bold text-red-500 hover:text-red-700 bg-red-50 hover:bg-red-100 px-3 py-1.5 rounded-xl transition flex items-center gap-1.5">
            <i class="fa-solid fa-arrow-right-from-bracket"></i>
            <span class="hidden sm:inline">Déconnexion</span>
          </button>
        </div>
      </div>

    </div>
  </header>

  <!-- Main Content Area -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-0 sm:p-4 md:p-6 pb-20 md:pb-6 flex flex-col">
    <router-outlet></router-outlet>
  </main>

  <!-- Bottom Navigation Bar (Visible ONLY on Mobile < md) -->
  <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 px-6 py-2.5 flex justify-between items-center z-40 shadow-lg">
    <a routerLink="/client/home" routerLinkActive="text-[#F5C518] font-bold" [routerLinkActiveOptions]="{exact: true}" class="flex flex-col items-center gap-1 text-gray-400 text-[11px] font-semibold">
      <i class="fa-solid fa-compass text-lg"></i>
      <span>Commander</span>
    </a>
    <a routerLink="/client/tracking" routerLinkActive="text-[#F5C518] font-bold" class="flex flex-col items-center gap-1 text-gray-400 text-[11px] font-semibold">
      <i class="fa-solid fa-location-dot text-lg"></i>
      <span>En direct</span>
    </a>
    <a routerLink="/client/history" routerLinkActive="text-[#F5C518] font-bold" class="flex flex-col items-center gap-1 text-gray-400 text-[11px] font-semibold">
      <i class="fa-regular fa-clock text-lg"></i>
      <span>Historique</span>
    </a>
    <a routerLink="/client/profile" routerLinkActive="text-[#F5C518] font-bold" class="flex flex-col items-center gap-1 text-gray-400 text-[11px] font-semibold">
      <i class="fa-regular fa-user text-lg"></i>
      <span>Profil</span>
    </a>
  </nav>

</div>
